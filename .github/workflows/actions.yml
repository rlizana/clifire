name: actions

on: [push, pull_request]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --frozen

    - name: Run pre-commit
      run: uv run pre-commit run --all-files

  test-python-3_8:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: '3.8'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv python install 3.8
          uv sync --frozen

      - name: Run unit tests
        run: uv run fire tests

  test-python-3_12:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: '3.12'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv python install 3.12
          uv sync --frozen

      - name: Run unit tests with coverage
        run: uv run fire coverage

      - name: Upload coverage to Coveralls
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        run: uv run --with coveralls coveralls
